name: Bug report
description: Report a reproducible wheeljack problem.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve wheeljack. Remove credentials, provider tokens,
        private transcripts, project source, app databases, and unrelated environment data.
  - type: input
    id: wheeljack-version
    attributes:
      label: wheeljack version
      description: Find this in Settings or the GitHub Release you installed.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Source build on another platform
    validations:
      required: true
  - type: input
    id: platform-version
    attributes:
      label: Platform version
      placeholder: Windows 11 24H2 or macOS 15.6
    validations:
      required: true
  - type: dropdown
    id: adapter
    attributes:
      label: Agent or terminal
      options:
        - Claude Code
        - Codex CLI
        - OpenCode
        - Pi Coding Agent
        - Generic shell
        - Not applicable
    validations:
      required: true
  - type: input
    id: adapter-version
    attributes:
      label: Agent CLI version
      description: Leave blank for generic shell or unrelated problems.
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest reliable sequence that triggers the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Safe diagnostics
      description: Paste the smallest relevant excerpt or the sanitized Settings diagnostics report.
      render: shell
  - type: checkboxes
    id: safety
    attributes:
      label: Preflight
      options:
        - label: I reproduced this on the latest wheeljack release or identified the source build above.
          required: true
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, tokens, private transcripts, project source, app databases, and unrelated environment data.
          required: true
